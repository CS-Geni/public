<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">CS-Geni interactive learning demo preview</title>
  <desc id="description">A dark green browser window showing the CS-Geni welcome message and three visual learning demos for variables, loops, and stacks.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07110e"/>
      <stop offset="1" stop-color="#10231b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60f28c" stop-opacity=".2"/>
      <stop offset="1" stop-color="#60f28c" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#60f28c" stroke-opacity=".07"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" rx="28" fill="url(#background)"/>
  <rect width="1200" height="630" rx="28" fill="url(#grid)"/>
  <circle cx="1030" cy="90" r="220" fill="url(#glow)"/>

  <rect x="54" y="48" width="1092" height="534" rx="20" fill="#0b1812" stroke="#315342" stroke-width="2"/>
  <path d="M54 104H1146" stroke="#294337" stroke-width="2"/>
  <circle cx="84" cy="76" r="7" fill="#ff9654"/>
  <circle cx="108" cy="76" r="7" fill="#f8cf66"/>
  <circle cx="132" cy="76" r="7" fill="#60f28c"/>
  <text x="166" y="82" fill="#a9b9ad" font-family="monospace" font-size="16">cs-geni.github.io/public</text>

  <g transform="translate(82 138)">
    <rect width="18" height="18" fill="#60f28c"/>
    <rect x="22" width="9" height="40" fill="#ff9654"/>
    <rect y="22" width="18" height="18" fill="#60f28c"/>
    <text x="48" y="31" fill="#f2f4df" font-family="system-ui, sans-serif" font-size="30" font-weight="700">CS-Geni</text>
  </g>

  <text x="82" y="244" fill="#f2f4df" font-family="system-ui, sans-serif" font-size="50" font-weight="750" letter-spacing="-1.5">Computer science is a</text>
  <text x="82" y="302" fill="#60f28c" font-family="system-ui, sans-serif" font-size="50" font-weight="750" letter-spacing="-1.5">world you can enter.</text>
  <text x="84" y="342" fill="#a9b9ad" font-family="system-ui, sans-serif" font-size="18">Change a value. Step through a loop. Build a stack.</text>

  <g transform="translate(82 392)">
    <rect width="310" height="142" rx="14" fill="#10231b" stroke="#315342"/>
    <text x="20" y="30" fill="#ff9654" font-family="monospace" font-size="13" font-weight="700">01  VALUES &amp; VARIABLES</text>
    <text x="20" y="61" fill="#f2f4df" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Give a value a name</text>
    <rect x="20" y="82" width="270" height="39" rx="6" fill="#08140e"/>
    <text x="36" y="107" fill="#60f28c" font-family="monospace" font-size="15">Ada has 3 points.</text>
  </g>

  <g transform="translate(412 392)">
    <rect width="310" height="142" rx="14" fill="#10231b" stroke="#315342"/>
    <text x="20" y="30" fill="#ff9654" font-family="monospace" font-size="13" font-weight="700">02  LOOPS</text>
    <text x="20" y="61" fill="#f2f4df" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Watch repetition work</text>
    <g transform="translate(20 82)">
      <rect width="58" height="39" rx="6" fill="#60f28c"/>
      <text x="19" y="26" fill="#07110e" font-family="monospace" font-size="18">▣</text>
      <rect x="68" width="58" height="39" rx="6" fill="#193326"/>
      <text x="87" y="26" fill="#a9b9ad" font-family="monospace" font-size="18">▣</text>
      <rect x="136" width="58" height="39" rx="6" fill="#193326"/>
      <text x="155" y="26" fill="#a9b9ad" font-family="monospace" font-size="18">▣</text>
    </g>
  </g>

  <g transform="translate(742 392)">
    <rect width="376" height="142" rx="14" fill="#10231b" stroke="#315342"/>
    <text x="20" y="30" fill="#ff9654" font-family="monospace" font-size="13" font-weight="700">03  DATA STRUCTURES</text>
    <text x="20" y="61" fill="#f2f4df" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Stack it up</text>
    <g transform="translate(225 75)">
      <rect y="38" width="116" height="20" rx="4" fill="#60f28c"/>
      <rect y="14" width="116" height="20" rx="4" fill="#ff9654"/>
      <path d="M-8 62H124" stroke="#6f8c7c" stroke-width="3"/>
    </g>
    <text x="20" y="107" fill="#a9b9ad" font-family="monospace" font-size="14">last in → first out</text>
  </g>

  <g transform="translate(930 152)">
    <rect width="188" height="178" rx="14" fill="#08140e" stroke="#315342"/>
    <circle cx="20" cy="20" r="4" fill="#ff9654"/>
    <circle cx="34" cy="20" r="4" fill="#f8cf66"/>
    <circle cx="48" cy="20" r="4" fill="#60f28c"/>
    <text x="18" y="62" fill="#6f8c7c" font-family="monospace" font-size="12">// start here</text>
    <text x="18" y="91" fill="#a3bbff" font-family="monospace" font-size="12">const</text>
    <text x="59" y="91" fill="#f2f4df" font-family="monospace" font-size="12">learner = {</text>
    <text x="30" y="116" fill="#f2f4df" font-family="monospace" font-size="12">curious:</text>
    <text x="96" y="116" fill="#ff9654" font-family="monospace" font-size="12">true</text>
    <text x="18" y="141" fill="#f2f4df" font-family="monospace" font-size="12">};</text>
    <rect x="18" y="153" width="90" height="4" rx="2" fill="#60f28c"/>
  </g>
</svg>
